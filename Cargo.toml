[workspace]
members = [
    "crates/*",
]

resolver = "2"

[workspace.package]
authors = ["Cognix Team <dev@khulnasoft.com>"]
license = "MIT"
publish = false

[workspace.dependencies]
# Local workspace crates. This lets us reference them in other crates without
# specifying a path.
asset_macro = { path = "crates/asset_macro" }
cognix_core = { path = "crates/cognix_core" }
cognix_features = { path = "crates/cognix_features" }
cognix_terminal = { path = "crates/cognix_terminal" }
cognix_util = { path = "crates/cognix_util" }
cognixui = { path = "crates/cognixui_core", package = "cognixui_core" }
cognixui_extras = { path = "crates/cognixui_extras" }
fuzzy_match = { path = "crates/fuzzy_match" }
markdown_parser = { path = "crates/markdown_parser" }
natural_language_detection = { path = "crates/natural_language_detection" }
settings = { path = "crates/settings" }
settings_value = { path = "crates/settings_value", default-features = false }
settings_value_derive = { path = "crates/settings_value_derive" }
string-offset = { path = "crates/string_offset" }
sum_tree = { path = "crates/sum_tree" }
websocket = { path = "crates/websocket" }

# Workspace-level dependencies used by multiple crates. Prefer adding dependencies
# here to copying-and-pasting versions.
anyhow = "1.0"
arboard = { version = "3.6.1", default-features = false }
arrayvec = "0.7.4"
async-broadcast = "0.7.2"
async-channel = "2.3.1"
async-fs = "2.1.2"
async-io = "2.4.0"
async-task = "4.2.0"
base64 = "0.22"
bounded-vec-deque = "0.1"
bytes = { version = "1.11.1", features = ["serde"] }
cfg-if = "1.0.0"
cfg_aliases = "0.2.1"
chrono = { version = "0.4.38", features = ["serde"] }
cocoa = "=0.26.0"
command-corrections = { git = "https://github.com/warpdotdev/command-corrections.git", rev = "eae08c8c51d9bc9741fcb17eef2c21f696aebbeb" }
concat-idents = "1.1.4"
content_inspector = "0.2.4"
ctrlc = "3.4.7"
dashmap = "6.1.0"
derivative = "2.2.0"
derive_more = "0.99.17"
directories = "6.0"
dirs = "6.0.0"
dunce = "1.0.1"
enum-iterator = "1.1.3"
float-cmp = "0.9.0"
font-kit = { git = "https://github.com/warpdotdev/font-kit", rev = "a04b225ecb639bb850f21d05212cfdc7465000f3", default-features = false, features = [
  "source",
] }
futures = { version = "0.3", features = ["executor", "thread-pool"] }
fuzzy-matcher = "0.3.7"
futures-lite = "1.13.0"
futures-util = { version = "0.3", default-features = false }
get-size = { version = "0.1.4", features = ["derive"] }
getset = "0.1.1"
# This matches the version of hyper used by reqwest.
hyper = "1.6.0"
graphql-ws-client = { version = "0.11.1", default-features = false }
gloo = { version = "0.11.0", default-features = false, features = [
  "events",
  "futures",
  "utils",
] }
gloo-storage = "0.3.0"
hex = "0.4.3"
html5ever = "0.35.0"
http = "1.1.0"
image = { version = "0.25.9", default-features = false, features = [
  "rayon",
  "jpeg",
  "png",
  "gif",
  "webp",
] }
infer = "0.19.0"
instant = { version = "0.1.12", features = ["wasm-bindgen"] }
inventory = "0.3.20"
itertools = "0.14.0"
lazy_static = "1.4.0"
line-ending = "1.4.0"
log = { version = "0.4", features = ["serde", "std"] }
markup5ever_rcdom = "0.35.0"
mime_guess = "2.0"
minimp4 = "0.1.2"
mockito = "1.7.0"
nom = "7.1.1"
num-traits = "0.2"
num-derive = "0.4.2"
num_cpus = "1.0"
objc = "0.2"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
once_cell = "1.20.2"
openh264 = "0.8"
ordered-float = { version = "3.0.0", features = ["serde"] }
ouroboros = "0.18"
parking_lot = "0.12.1"
pathdiff = "0.2.1"
pathfinder_color = "0.5"
pathfinder_geometry = "0.5.1"
percent-encoding = "2.3.1"
pin-project = "1.0.10"
rand = "0.8.2"
rangemap = "1.3.0"
raw-window-handle = "0.6.2"
regex = "1.11.1"
reqwest = { version = "0.12.28", default-features = false, features = [
  "blocking",
  "brotli",
  "charset",
  "gzip",
  "http2",
  "json",
  "macos-system-configuration",
  "rustls-tls-native-roots-no-provider",
  "stream",
  "system-proxy",
] }
resvg = "0.47.0"
rust-embed = { version = "8.7.0", features = ["include-exclude"] }
rustc-hash = "2.1.1"
rust-stemmers = "1.0"
schemars = { version = "1", features = ["chrono04"] }
secret-service = { version = "5.0.0", features = ["rt-async-io-crypto-rust"] }
security-framework = "2.0.0"
sentry = { version = "0.41.0", default-features = false, features = [
  "anyhow",
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "release-health",
  "reqwest",
  "rustls",
] }
sentry-log = "0.41.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_with = "2.0.1"
serde_yaml = "0.8"
sha2 = "0.10"
shellexpand = "3.1.1"
similar = { version = "2.7", features = ["inline"] }
simplelog = "0.12.2"
smallvec = "1.6.1"
strum = "0.27"
strum_macros = "0.27"
sysinfo = { version = "0.37.0", default-features = false, features = [
  "system",
  "multithread",
] }
tempfile = "3.8.0"
thiserror = "2.0.17"
tokio = "1.47.1"
toml_edit = "0.25.5"
trait-set = "0.3.0"
typed-path = "0.10.0"
url = "2.5.4"
vec1 = { version = "1.8.0", features = ["serde"] }
wasm-bindgen = "0.2.89"
wasm-bindgen-futures = "0.4.42"
woothee = "0.13.0"
windows = { version = "0.62.2", features = [
  "Win32",
  "Win32_System",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Wdk_System",
  "Wdk_System_SystemServices",
  "Win32_System_Com",
  "Win32_System_SecurityCenter",
  "Win32_System_SystemInformation",
  "Win32_System_Console",
] }
windows-registry = { version = "0.2.0" }
windows-result = { version = "0.2.0" }

[profile.dev]
# Use line-tables-only to speed up dev builds. Change to `debug = true` if you
# need full debuginfo for step-through debugging (gdb/lldb).
debug = "line-tables-only"
# loads debuginfo without needing to run dsymutil, leave the .o object files
# in the build output directory instead of deleting them, and skips the step of running dsymutil.
# Rust's backtrace support is smart enough to know that it can still generate
# good backtraces without separate debug info.
split-debuginfo = "unpacked"