[package]
name = "cognix_terminal"
version = "0.1.0"
edition = "2021"
description = "Block-structured terminal engine: every command and its output grouped into an addressable Block"
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cognix"
path = "src/bin/cognix.rs"

[dependencies]
cognix_core.workspace = true
fuzzy_match.workspace = true
natural_language_detection.workspace = true

arborium.workspace = true
chrono.workspace = true
lazy_static.workspace = true
log.workspace = true
parking_lot.workspace = true
rangemap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
streaming-iterator.workspace = true
thiserror.workspace = true
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "process"] }
uuid = { version = "1.1.2", features = ["v4"] }

arboard.workspace = true
clap = { version = "4.5", features = ["derive"] }
shell-words = "1.1"

[dev-dependencies]
tempfile.workspace = true